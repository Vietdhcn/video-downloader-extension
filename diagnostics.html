<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title data-i18n="video_catcher_chan_doan_hngv">Video Catcher · Chẩn đoán</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body.diag { width: auto; min-height: 100vh; }
    .appbar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
    .appbar .brand { font-size: 18px; }
    .appbar button { height: 40px; padding: 0 18px; border-radius: 20px; font-size: 14px; }
    .appbar .actions { display: flex; gap: 8px; }
    .appbar .brand, .appbar button { white-space: nowrap; }
    /* Cửa sổ hẹp: thanh trên một dòng (trước đây tiêu đề và hai nút xuống hai dòng ở 375 px) */
    @media (max-width: 520px) {
      .appbar { padding: 10px 16px; gap: 8px; }
      .appbar .brand { font-size: 16px; gap: 8px; }
      .appbar button { padding: 0 14px; }
      .appbar .long { display: none; }
      .wrap { padding: 16px 16px 40px; }
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 24px 24px 48px; }
    .pagecard { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 16px; background: var(--card); }
    .pagecard .av { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--card2); color: var(--fg); font-weight: 700; font-size: 18px; }
    .pagecard .tx { min-width: 0; }
    .pagecard b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pagecard small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tally { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 12px; }
    .tally span { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 13px; font-weight: 500; background: var(--card2); color: var(--fg); }
    .tally .bad, .tally .warn { background: var(--primary-soft); color: var(--on-primary-soft); }
    ul.checks { list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-direction: column; border-radius: 16px; background: var(--card); overflow: hidden; }
    .checks li { display: grid; grid-template-columns: 28px 1fr; gap: 2px 14px; align-items: start; padding: 14px 16px; }
    .checks li + li { border-top: 1px solid var(--border); }
    .checks .icon { grid-row: span 2; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-size: 13px; font-weight: 700; background: var(--card2); color: var(--fg); }
    .checks .bad .icon, .checks .warn .icon { background: var(--primary-soft); color: var(--on-primary-soft); }
    .checks .what { font-weight: 500; font-size: 14px; line-height: 20px; padding-top: 4px; } /* căn giữa biểu tượng 28 px, dòng thứ hai không cách xa */
    .checks .todo { color: var(--muted); font-size: 13px; }
    details.tech { border: 1px solid var(--border); border-radius: 16px; background: var(--bg); }
    details.tech summary { cursor: pointer; padding: 12px 16px; color: var(--muted); font-weight: 600; }
    details.tech pre { margin: 0; padding: 14px 16px; border-top: 1px solid var(--border); max-height: 420px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 ui-monospace, Consolas, monospace; }
    #status { margin-top: 16px; text-align: center; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body class="diag">
  <header class="appbar">
    <h1 class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 20h14"/></svg></span><span data-i18n="chan_doan_hx87">Chẩn đoán</span></h1>
    <div class="actions">
      <button id="copy" disabled aria-label="Sao chép báo cáo" data-i18n-aria-label="sao_chep_bao_cao_oxif" title="Sao chép báo cáo" data-i18n-title="sao_chep_bao_cao_oxif">Sao chép<span class="long" data-i18n="bao_cao_vt99"> báo cáo</span></button>
      <button id="refresh" class="primary" data-i18n="kiem_tra_lai_1j5u">Kiểm tra lại</button>
    </div>
  </header>
  <main class="wrap">
    <div id="page" class="pagecard" hidden></div>
    <div id="tally" class="tally"></div>
    <ul id="checks" class="checks" hidden></ul>
    <details id="details" class="tech" hidden>
      <summary data-i18n="chi_tiet_ky_thuat_7g18">Chi tiết kỹ thuật</summary>
      <pre id="report"></pre>
    </details>
    <p id="status" role="status" data-i18n="dang_kiem_tra_1va4">Đang kiểm tra…</p>
  </main>
  <script src="lib/locales/en.js"></script>
  <script src="lib/locales/vi.js"></script>
  <script src="lib/i18n.js"></script>
  <script src="lib/m3u8.js"></script>
  <script src="diagnostics.js"></script>
</body>
</html>
